function plan(){return `<p class="eyebrow">设计决策 / 对照 PRD v0.3</p><h1>一个页面，先帮用户完成一件事。</h1><p class="plan-intro">目标是让用户在排队、等车时，一眼知道从哪里继续，完成一小步后得到反馈。完整功能通过分层保留，详情在需要时展开。</p><div class="plan-list">
 <section class="plan-item"><h2><span class="number">01</span>当前问题与证据</h2><p>V01 课程页同时出现知识卡、四个片段、四个题目、完整图文，以及标题旁和右下角两处搭子入口；原生视频控件外还有一排同类操作。手机宽度 390 时，首屏大段说明把挑战入口挤到下方。首页把宣传区、推荐内容和队列并列展示，未突出回访用户的接续任务。</p><p>判断：功能围绕模块陈列，用户需要自己决定顺序。视觉风格已有一致性，主要需要重排任务层级、减少同时出现的选择，并提高正文和辅助文字的可读性。这是界面评审推断，尚未做真实用户验证。</p></section>
 <section class="plan-item"><h2><span class="number">02</span>功能去向</h2><table class="mapping"><thead><tr><th>区域</th><th>第一眼看到</th><th>展开后可用</th></tr></thead><tbody><tr><td>学习首页</td><td>一句话接续 + 一个主推荐 + 最多两个备选</td><td>推荐原因、换一个、稍后；首次体验后可领养；全部内容进入内容库</td></tr><tr><td>课程页</td><td>本次目标、播放器、明确的开始或继续按钮</td><td>要点 / 图文 / 出处；片段目录；一个上下文搭子入口；直接挑战与完整关卡列表</td></tr><tr><td>关卡</td><td>一道题、选项、提交</td><td>确认使用提示、结果解释、对应片段、关联知识；答错可再试</td></tr><tr><td>工作台</td><td>知识进展 + 今日队列入口 + 用于工作</td><td>知识 / 成果 / 记录；全部内容；记忆、目标、整理历史和数据管理</td></tr><tr><td>搭子</td><td>角色、当前阶段和真实成长缘由</td><td>形态、聊天、记忆、名字、交流偏好；工作台复用同一记忆管理面板</td></tr></tbody></table></section>
 <section class="plan-item"><h2><span class="number">03</span>课程页的状态和闭环</h2><p>首次进入：开始播放为主操作，挑战入口始终可用。中断返回：从上次位置继续为主操作，同时可从头看。视频结束：一句发现 + 做个判断 + 可选下一小步。图文阅读：自己的完成记录，不能冒充视频看完或理解。关卡通过：先保存证据，再给反馈与成长，提示后的记录须标为有引导。</p><p>打开搭子先暂停视频，关闭后由用户继续。视频出错显示重试和图文解释。离开页面、隐藏页面和定时保存的行为沿用 PRD。知识依据、证据强度、版本与保存范围放入对应详情；保存失败必须就地显示并提供恢复操作。</p></section>
 <section class="plan-item"><h2><span class="number">04</span>手机与桌面的布局</h2><p>手机优先单列，播放器占满可用宽度；课程与作答页进入专注状态，保留返回入口，主导航出现在学习、工作台、搭子三个主页面。桌面用窄侧导航，课程仍以一个内容区为主，移除默认展开的三组右侧卡片。知识图在桌面展示网络，手机按章节展示节点列表。</p><p>正文建议 15–16 px，辅助说明 12–13 px，点击目标至少 44 px；主操作使用深绿实色，次操作用边框，说明用灰色。桌面内容限制宽度，利用分隔线组织区域；字幕保持可见。知识状态除颜色外保留文字。</p></section>
 <section class="plan-item"><h2><span class="number">05</span>实施顺序与验收</h2><p>P0：先收敛 V01 课程页，统一播放控件和搭子入口，将知识、出处、目录和完整题单分层；再把首页改为接续优先，并区分首次与回访状态。P1：工作台按知识 / 成果 / 学习记录组织，搭子页集中养成和偏好。沿用现有播放、学习证据与奖励机制，改布局时核对内容入口没有丢失。</p><p>验收：360 px 下无横向滚动，课程首屏能开始或继续；无需向下翻找就可切换图文或直接挑战；所有 4 个片段和 4 道题可找到；来源和知识点能回查；中断能恢复、失败可重试。用 3–5 位目标用户做“继续上次 / 找出处 / 直接挑战”任务，观察第一步是否正确；测试数量和效果是待验证计划。</p></section></div><p class="page-end">这是快速布局方案，可点击查看典型路径。原型中的进展为示例，未替换当前产品页面或更改学习数据。</p>`}

function challenge(){selected=-1;guided=false;openDrawer('做一个判断 · 约 1 分钟',`<p class="eyebrow">第 1 章 / 理解练习 1</p><h2>自信回答但材料缺失，优先做什么？</h2><p class="muted small">可以跳过视频直接尝试；返回时恢复答案草稿。</p>${['根据语气相信','核对材料','只改排版','提高语速'].map((a,i)=>`<button class="answer" data-answer="${i}">${String.fromCharCode(65+i)}　${a}</button>`).join('')}<div class="play-row"><button class="btn primary" data-action="submit" id="submit" disabled>提交判断</button><button class="quiet" data-action="hint">查看一层提示</button></div><div id="feedback"></div><details class="segments"><summary>本章全部关卡 · 可自由选择</summary>${['理解练习 1','理解练习 2','章节检查 1','章节检查 2'].map(t=>`<button class="segment-row" data-action="other-question">${t} →</button>`).join('')}</details>`)}
document.addEventListener('click',async e=>{
const b=e.target.closest('[data-screen],[data-action],[data-lesson-tab],[data-work-tab],[data-seek],[data-answer],[data-filter]');if(!b)return;
if(b.dataset.screen){$('#modal').innerHTML='';location.hash=b.dataset.screen;window.scrollTo(0,0);return}
if(b.dataset.lessonTab){lessonTab=b.dataset.lessonTab;render();return}
if(b.dataset.workTab){workTab=b.dataset.workTab;render();return}
if(b.dataset.filter){libraryFilter=b.dataset.filter;library();return}
if(b.dataset.seek){const v=$('#lesson-video');if(v){v.currentTime=Number(b.dataset.seek);$('#continue').textContent=`▶ 从 ${b.dataset.seek} 秒播放`}return}
if(b.dataset.answer!==undefined){selected=Number(b.dataset.answer);document.querySelectorAll('.answer').forEach(x=>x.classList.toggle('selected',x===b));$('#submit').disabled=false;return}
const action=b.dataset.action;
if(action==='close'){$('#modal').innerHTML='';return}
if(action==='play'||action==='restart'){const v=$('#lesson-video');if(v){if(action==='restart')v.currentTime=0;try{await v.play();$('#continue').textContent='正在播放 · 可以随时暂停'}catch{toast('请使用播放器的播放按钮继续')}}return}
if(action==='challenge'){challenge();return}
if(action==='toggle-new'){isNew=!isNew;render();return}
if(action==='open-video'){location.hash='lesson';$('#modal').innerHTML='';return}
if(action==='open-text'){lessonTab='text';if(screen==='lesson')render();else location.hash='lesson';$('#modal').innerHTML='';return}
if(action==='library'){library();return}
if(action==='submit'){const right=selected===1;$('#feedback').innerHTML=`<div class="feedback"><h3>${right?'这个判断有依据。':'先检查材料，再决定信不信。'}</h3><p>表达不能替代依据核对。语气、排版和语速都不能补足缺少的材料。</p><p class="small muted">${guided?'有引导的练习':'示例独立答题反馈'} · 原型不写入真实学习证据或奖励</p><button class="quiet" data-action="open-video">回到对应片段 ↗</button><button class="quiet" data-action="node">关联知识 ↗</button><button class="btn secondary" data-action="next">下一小步 →</button></div>`;return}
if(action==='hint'){if(!guided){guided=true;const f=$('#feedback');f.innerHTML='<div class="source-note"><p>提示：先找能支持结论的信息。</p><p class="small muted">已查看提示，本次正确回答应记为有引导的练习。</p></div>'}return}
if(action==='read'){toast('示例：记录图文阅读，并提供可选判断');return}
if(action==='why'){openDrawer('为什么推荐这一小步',`<p>当前目标是“建立基础”。这节内容是路线的起点，帮你分清表达质量与证据支持。</p><p class="muted small">没有足够个人证据时，使用通用重点，避免把路线建议说成能力诊断。</p><div class="drawer-actions"><button class="btn secondary" data-action="feedback">与我无关</button><button class="btn secondary" data-action="feedback">已知道</button><button class="btn secondary" data-action="feedback">太难了</button><button class="quiet" data-action="off">关闭重点标记</button></div>`);return}
if(action==='agent'){openDrawer('识光 · 帮你理解当前内容',`<div class="welcome"><span class="orb"></span><p>先把“说得顺”和“有依据”分开看。</p></div><p class="small muted">内置内容帮助，依据当前段落提供讲解与提示。原型没有实时模型调用。</p><div class="drawer-actions"><button class="btn secondary" data-action="example">换个例子</button><button class="btn secondary" data-action="node">这和之前有什么关系？</button><button class="btn secondary" data-action="source">依据在哪里？</button></div><p class="small muted">进入帮助时暂停；关闭后由你决定继续播放。</p>`);return}
if(action==='source'){openDrawer('观点与原文定位',`<p class="eyebrow">回答可靠性 / 来源库 S01</p><h3>Anthropic · 减少幻觉</h3><p>当前教学观点：可靠性需要另外核对证据；信息不足时说明缺口。</p><div class="source-note"><strong>原文片段与上下文</strong><p class="muted small">正式实现复用现有来源面板的精确定位引用。这里仅展示面板的布局；不把教学改写冒充原文。</p></div><p class="small muted">版本 1 · 核对 2026-10-12<br>教学案例为原创模拟情境；方法不能消除全部幻觉。</p><a href="https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations" target="_blank" rel="noopener noreferrer">打开完整原文 ↗</a>`);return}
if(action==='node'){openDrawer('知识详情 · 回答与依据',`<p>逐条对照回答中的陈述，判断给定材料支持了什么、没有支持什么。</p><div class="card"><h3>它与其他知识怎样相连</h3><p>流畅 ≠ 可靠 → 回答与依据 → 信息不足</p><p class="small muted">先核对材料，才能说清缺少哪些信息。</p></div><div class="card"><h3>个人记录与依据</h3><p class="small muted">已接触（示例） · 观看或图文阅读<br>理解状态由具体题目、提示条件和日期支持。</p><button class="quiet" data-action="evidence">查看学习证据 ↗</button></div><div class="drawer-actions"><button class="btn primary" data-action="open-video">回到对应内容 →</button><button class="btn secondary" data-action="challenge">做个判断</button><button class="quiet" data-action="source">查看引用</button></div>`);return}
if(action==='application'){openDrawer('用于我的工作',`<h3>生成一张方案判断卡</h3><p class="muted">围绕真实场景检查“回答是否可信、问题可能在哪、怎样验证”。</p><div class="card"><p>工作目标：评审内部知识库助手</p><p>当前问题：回答超出材料</p><p>建议：逐条核对回答中的陈述。</p><p class="small muted">待确认：实际回答、给定材料和约束说明。信息不足时保留待确认项。</p></div><div class="drawer-actions"><button class="btn primary" data-action="demo-save">编辑并保存判断卡 →</button><button class="quiet" data-work-tab="results" data-screen="workbench">查看已有成果 ↗</button></div><p class="small muted">此面板演示应用入口；正式功能沿用现有生成、编辑、保存、复制和导出。</p>`);return}
if(action==='memory'){openDrawer('识光记得什么',`<div class="settings-list"><div class="setting-row"><div><strong>明确偏好</strong><small>建立基础 · 简洁友好</small></div><button class="quiet" data-action="preferences">修改 ↗</button></div><div class="setting-row"><div><strong>接续位置</strong><small>V01 / 18 秒（示例）</small></div><span>来自播放记录</span></div><div class="setting-row"><div><strong>理解记录</strong><small>来自具体作答，包含提示与情境</small></div><button class="quiet" data-action="evidence">依据 ↗</button></div></div><p class="muted small">可修改偏好、删除对话或移除证据。正式页面说明删除影响，并重算依赖状态；经验与形态按 PRD 保留。</p>`);return}
if(action==='queue'){openDrawer('今日队列 · 最多三项',`<p class="muted">是可用建议，没有每日作业和补账。</p>${['继续 V01 / 18 秒','理解练习 Q01','图文微讲解 T01'].map(t=>`<div class="progress-row"><strong>${t}</strong><span><button class="quiet" data-action="demo-save">置顶</button><button class="quiet" data-action="snooze">稍后</button></span></div>`).join('')}<p class="small muted">置顶、稍后、跳过可撤销；Agent 更新不覆盖正在操作的顺序。</p>`);return}
if(action==='settings'){openDrawer('学习数据与帮助',`<p>正式产品的学习记录保存在当前浏览器；换设备或清理浏览器可能丢失。</p><div class="settings-list">${['导出学习数据','减少动画','内容来源与帮助范围','清除全部学习数据'].map(t=>`<button class="setting-row" data-action="demo-save">${t}<span>›</span></button>`).join('')}</div><p class="small muted">清除在正式产品中需说明影响并确认。布局原型不会清除或修改当前产品数据。</p>`);return}
const details={preferences:['目标与交流偏好','学习目标、名字和交流风格使用同一个管理面板。修改目标后重新安排未来建议，保留已有进展。'],appearance:['已解锁的形态','基础精灵、观察员、连接者、探索者。解锁后可以自由切回；外观变化和学习记录一起呈现。'],growth:['成长记录','经验来自首次通过练习与检查题。每条记录可查看题目和章节；观看与聊天不会增加经验。'],evidence:['学习证据','显示对应题目、答案、是否查看提示、情境和日期。每个统计都能回到具体记录。'],history:['整理更新与历史','查看原状态、拟更新状态、依据、适用范围、时间和路线变化；可按现有机制撤回更新。'],time:['估算投入明细','观看、阅读、作答、对话与应用取活动区间并集。站外阅读未计入，超过预算仍可继续。'],curation:['策展内容','标明策展属性、来源日期、影响节点与适用范围；没有真实新变化时，不使用最新资讯的表述。'],example:['换个例子','一份宣传写得很漂亮，不等于承诺有依据。先核对材料是否支持每一条具体陈述。'],next:['下一小步','完成反馈后提供一个明确下一步，同时可以退出。回到首页时以未完成任务优先接续。']};
if(details[action]){openDrawer(details[action][0],`<p>${details[action][1]}</p><p class="small muted">这是布局说明，正式实现沿用 PRD 和现有业务机制。</p>`);return}
const tips={feedback:'示例：记录反馈，解释或路线可以调整',off:'示例：关闭个人重点，普通内容仍可阅读',snooze:'示例：稍后安排，并提供撤销', 'change-task':'示例：切换到另一条相关建议','demo-save':'布局演示：当前产品的学习数据未被修改','other-question':'原型仅演示一道题；正式页保留本章全部关卡'};if(tips[action])toast(tips[action]);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').innerHTML='';if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [data-action]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
window.addEventListener('hashchange',render);render();
</script>
